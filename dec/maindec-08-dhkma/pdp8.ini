# Load the test
load memtst.bin
# Configure for software SR
# SR00 Halt on error
# SR05 Halt after one pass
d 20 4101
d 21 0
d 22 400
# Breakpoint on attempt to return to OS/8
br 7600;q
#
# Breakpoint on any TAD I TSTAD
br -i 1457;e 52;e 57;c
# Breakpoint on any DCA I TSTAD
br -i 3457;e ac;e 52;e 57;c
# Turn on logging
set log log_file
g 200
# Turn off logging
set nolog
