# Mount DECtape(s)
att dt0 os8basic-v4a.tu56
att dt1 os8-boot-diag.tu56
# Load the diagnostic
load maindec-08-d3bc-pb
# SR 0-7 -- drive selected for test
d sr 6000
# SA 0201 -- Find all blocks
g 0201
# PC should be 0223
# AC should match drives selected above
e ac
# Find all blocks: SR11 to not halt after one pass
d sr 0
# Set a breakpoint on each command to examine the command sequence
br 0404;e 114; e ac;c
br 0617;e 114; e ac;c
br 1611;e 114; e ac;c
br 1671;e 114; e ac;c
br 1736;e 114; e ac;c
br 2221;e 114; e ac;c
br 2226;e 114; e ac;c
br 2244;e 114; e ac;c
br 2467;e 114; e ac;c
br 2504;e 114; e ac;c
br 2632;e 114; e ac;c
br 3232;e 114; e ac;c
br 3453;e 114; e ac;c
br 3515;e 114; e ac;c
br 3605;e 114; e ac;c
br 3656;e 114; e ac;c
br 4212;e 114; e ac;c
br 4266;e 114; e ac;c
br 4300;e 114; e ac;c
br 4344;e 114; e ac;c
br 4352;e 114; e ac;c
br 4361;e 114; e ac;c
# Set breakpoints related to interrupt service
# br 0001;e 0;e 2;c
#br 0262;e ac;c
#br 0266;e ac;c
#br 0271;e 234;c
# Back from WAITI...took error return
br 0407;e ac;c
br 0722;e ac;c
br 2434;e ac;c
br 2472;e ac;c
br 2511;e ac;c
br 2547;e ac;c
# All drives rewound when we get here
br 0416;e 400;c
# Fire up the test
c
