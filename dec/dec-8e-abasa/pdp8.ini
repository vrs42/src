load dec-8e-abasa-a-pb
# There's a bug in the ISR where a printer error
# interrupt causes an early exit, but if no printer
# is assigned, the error condition isn't cleared.
# This means the KSF is never reached!
# at lpt foo.lpt ; # exposes bug
set lpt disable ; # exposes bug
# Disable clock interrupts
d 7736 6132
# Start up
run 16000
q
